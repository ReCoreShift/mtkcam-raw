name: chore

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the project
        run: pip install ".[dev]"

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Verify CLI entry points
        run: |
          mtkcam-raw --help
          python -m mtkcam_raw --help

      - name: Verify patch integrity
        run: |
          mtkcam-raw inspect bin/libmtkcam_metastore.so > /dev/null
          echo "inspect ok"
